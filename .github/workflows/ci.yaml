name: PlatformIO CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant:
          - nanoatmega328-debug
          - nanoatmega328-product
          - nanoatmega328-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Create override file
        run: |
          cp ./post_extra_script_sample.py ./post_extra_script.py
          echo '#define VERS_TAG "1.0-deadbeef"' > ./include/version.h
      - name: Build PlatformIO Project
        run: pio run -e ${{ matrix.variant }}